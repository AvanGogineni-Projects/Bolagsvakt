[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bolagsvakt"
version = "0.0.1"
description = "Weekly risk monitoring of Swedish companies from Bolagsverket open data"
requires-python = ">=3.12"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
optional-dependencies = {pipeline = {file = ["requirements-pipeline.txt"]}, dev = {file = ["requirements-dev.txt"]}}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File"]
