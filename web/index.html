<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bolagsvakt watches your customers and suppliers in Bolagsverket's registry and annual reports, and tells you when one starts going wrong." />
    <meta name="theme-color" content="#F3EFE6" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='4' width='22' height='24' rx='3' fill='none' stroke='%231A1714' stroke-width='2.5'/%3E%3Cpath d='M10 12h12M10 17h12M10 22h7' stroke='%231A1714' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='7' r='4.5' fill='%23C2361F'/%3E%3C/svg%3E" />
    <title>Bolagsvakt — company watch</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes light.
      try {
        const t = localStorage.getItem('bolagsvakt_theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
